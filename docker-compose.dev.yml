services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    ports:
      - "5432:5432"   # expose for direct psql access in dev
    environment:
      POSTGRES_USER: mmess
      POSTGRES_PASSWORD: mmess
      POSTGRES_DB: mmess
    volumes:
      - mmess_postgres_dev:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U mmess"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    image: node:22-alpine
    working_dir: /app
    # Install deps inside container then start tsx watch (deps not available from host on Linux containers)
    command: sh -c "npm ci --workspace=server && cd server && npx tsx watch src/index.ts"
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://mmess:mmess@postgres:5432/mmess
      PORT: "3000"
      HOST: "0.0.0.0"
      LOG_LEVEL: debug
      JWT_ACCESS_SECRET: dev-access-secret-change-in-prod
      JWT_REFRESH_SECRET: dev-refresh-secret-change-in-prod
      JWT_ACCESS_EXPIRES_IN: 15m
      JWT_REFRESH_EXPIRES_IN: 7d
      UPLOAD_DIR: /data/uploads
      MAX_FILE_SIZE_MB: "50"
    volumes:
      - .:/app                              # bind-mount full monorepo for hot reload
      - mmess_uploads_dev:/data/uploads
      - mmess_node_modules:/app/node_modules  # shadow host node_modules — prevents sharp musl/glibc mismatch
    healthcheck:
      test: ["CMD-SHELL", "node -e \"require('http').get('http://localhost:3000/health',r=>process.exit(r.statusCode===200?0:1)).on('error',()=>process.exit(1))\""]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

  caddy:
    image: caddy:2-alpine
    ports:
      - "8081:80"    # mapped to 8081 on Windows (port 80 reserved by HTTP.sys; 8080 used by Keycloak)
      - "8443:443"   # mapped to 8443 on Windows (use https://localhost:8443 in dev)
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - ./client/dist:/srv/www:ro
      - caddy_data_dev:/data
      - caddy_config_dev:/config
    depends_on:
      - api
    healthcheck:
      test: ["CMD-SHELL", "caddy version || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
    environment:
      DOMAIN: localhost

volumes:
  mmess_postgres_dev:
    driver: local
  mmess_uploads_dev:
    driver: local
  mmess_node_modules:
    driver: local
  caddy_data_dev:
    driver: local
  caddy_config_dev:
    driver: local
